[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "adaptive-ml"
version = "0.1.0"
description = "Adaptive ML Framework for Continual Learning with Catastrophic Forgetting Prevention"
authors = ["AdaptiveML Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "adaptive_ml", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
torch = ">=2.0.0"
transformers = ">=4.40.0"
peft = ">=0.10.0"
accelerate = ">=0.27.0"
numpy = ">=1.24.0"
scipy = ">=1.10.0"
faiss-cpu = ">=1.7.4"
faiss-gpu = { version = ">=1.7.4", optional = true }
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
pyyaml = ">=6.0"
rich = ">=13.0.0"
typer = ">=0.9.0"
mlflow = ">=2.0.0"
onnx = ">=1.14.0"
onnxruntime = ">=1.15.0"
qdrant-client = ">=1.5.0"
sentence-transformers = ">=2.2.2"
langdetect = ">=1.0.9"
bitsandbytes = ">=0.41.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.4.0"

[tool.poetry.scripts]
adaptive-ml = "adaptive_ml.cli.main:app"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
