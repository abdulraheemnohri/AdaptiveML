version: '3.8'

services:
  # Main Application Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: adaptive-omni-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./checkpoints:/app/checkpoints
      - ./adapters:/app/adapters
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./configs:/app/configs
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/adaptive_omni_ml
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    depends_on:
      - db
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - adaptive-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adaptive-omni-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - adaptive-network
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: adaptive-omni-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=adaptive_omni_ml
    ports:
      - "5432:5432"
    networks:
      - adaptive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d adaptive_omni_ml"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching & Task Queue
  redis:
    image: redis:7-alpine
    container_name: adaptive-omni-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - adaptive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker for Background Tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: adaptive-omni-worker
    command: celery -A backend.app.workers.celery_app worker --loglevel=info
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./checkpoints:/app/checkpoints
      - ./adapters:/app/adapters
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/adaptive_omni_ml
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - adaptive-network
    restart: unless-stopped

  # Celery Beat for Scheduled Tasks
  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: adaptive-omni-beat
    command: celery -A backend.app.workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/adaptive_omni_ml
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - adaptive-network
    restart: unless-stopped

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: adaptive-omni-prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - adaptive-network
    restart: unless-stopped

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: adaptive-omni-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - adaptive-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  adaptive-network:
    driver: bridge
