# Adaptive ML Framework - Default Configuration
# Multi-modal continual learning with Qwen2.5-Omni-3B

model:
  base_model: "Qwen/Qwen2.5-Omni-3B"
  tokenizer: null  # Uses base_model's tokenizer if null
  dtype: "bfloat16"
  device_map: null  # Auto-detect for multi-GPU
  
  # Multi-modal settings
  modality: "multi_modal"  # text, vision, audio, multi_modal
  vision_encoder: null  # Custom vision encoder (optional)
  audio_encoder: null  # Custom audio encoder (optional)
  
  # Quantization for large models
  quantize: true
  quantization_bits: 4  # 4, 8, or null for no quantization

training:
  batch_size: 32
  learning_rate: 1e-4
  num_epochs: 3
  max_steps: null
  gradient_accumulation_steps: 1
  warmup_steps: 100
  weight_decay: 0.01
  
  # Continual learning specific
  ewc_lambda: 1000.0  # EWC regularization strength
  mas_lambda: 100.0  # MAS regularization strength
  si_lambda: 100.0  # SI regularization strength
  distill_alpha: 0.5  # Knowledge distillation weight
  replay_ratio: 0.3  # Fraction of batch from replay buffer
  
  # Parameter importance method
  importance_method: "ewc"  # ewc, mas, si, fisher, gradient
  
  # Dynamic architecture
  dynamic_lora: true  # Enable dynamic LoRA rank adaptation
  lora_rank_range: [8, 64]  # Min and max LoRA rank
  lora_growth_rate: 1.1  # Rank growth multiplier
  
  # Optimization
  optimizer: "adamw"
  scheduler: "cosine"
  mixed_precision: "bf16"  # no, fp16, bf16
  
  # Device
  device: "auto"  # auto, cuda, cpu

adapters:
  adapter_type: "lora"  # lora, qlora, adapter, prefix, ia3
  r: 16  # Rank for LoRA
  lora_alpha: 32  # Scaling factor for LoRA
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  task_type: "CAUSAL_LM"
  
  # QLoRA specific
  bits: 4  # Quantization bits
  double_quant: true
  
  # Adapter routing
  use_router: true
  router_type: "domain"  # domain, task, hybrid
  
  # Dynamic LoRA
  dynamic_rank: true  # Enable dynamic rank adaptation
  min_rank: 8  # Minimum LoRA rank
  max_rank: 64  # Maximum LoRA rank
  rank_growth_rate: 1.1  # Multiplier for rank growth
  rank_shrink_threshold: 0.8  # Accuracy threshold to shrink rank
  
  # Multi-modal adapters
  use_vision_adapter: true  # Use adapter for vision modality
  use_audio_adapter: true  # Use adapter for audio modality
  vision_adapter_type: "lora"  # Adapter type for vision
  audio_adapter_type: "lora"  # Adapter type for audio

memory:
  buffer_size: 10000
  sampling_strategy: "balanced"  # uniform, balanced, importance, diversity, hard_example
  
  # Diversity sampling
  diversity_metric: "cosine"  # cosine, euclidean, dot
  diversity_threshold: 0.5
  
  # Importance sampling
  importance_metric: "uncertainty"  # uncertainty, loss, custom
  
  # Reservoir sampling
  use_reservoir: true
  
  # Memory compression (for large buffers)
  use_compression: true
  compression_method: "ivf"  # ivf, pq, ivf_pq, hnsw
  nlist: 100  # Number of IVF clusters
  nprobe: 10  # Number of probes for IVF
  m: 8  # PQ codebook size
  nbits: 8  # PQ quantization bits

drift:
  window_size: 1000
  reference_size: 1000
  
  # Statistical drift
  statistical_test: "ks"  # ks, psi, wasserstein
  statistical_threshold: 0.05
  
  # Semantic drift
  semantic_threshold: 0.15
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  
  # Multi-modal semantic drift
  use_clip: true  # Use CLIP for image-text drift detection
  clip_model: "openai/clip-vit-base-patch32"  # CLIP model for multi-modal
  clip_threshold: 0.2  # Threshold for CLIP-based drift
  
  # Concept drift
  concept_threshold: 0.1
  
  # Advanced drift detection
  use_ensemble: true  # Combine multiple drift detection methods
  ensemble_weights:
    statistical: 0.4
    semantic: 0.3
    clip: 0.3

evaluation:
  promotion_strategy: "strict"  # strict, balanced, aggressive
  retention_threshold: 0.95  # Minimum retention score for promotion
  new_task_threshold: 0.1  # Minimum improvement on new tasks
  
  # Retention score weights
  new_score_weight: 0.4
  old_score_weight: 0.4
  forgetting_penalty_weight: 0.2
  
  # A/B testing
  ab_test_ratio: 0.1  # Fraction of traffic for A/B test
  ab_test_duration: "1h"  # Duration for A/B test
  
  # Advanced evaluation metrics
  use_perplexity: true  # Calculate perplexity for language tasks
  use_bleu: true  # Calculate BLEU score for text generation
  use_rouge: true  # Calculate ROUGE score for text generation
  use_f1: true  # Calculate F1 score for classification
  
  # Multi-modal evaluation
  use_vision_metrics: true  # Calculate vision-specific metrics
  use_audio_metrics: true  # Calculate audio-specific metrics

registry:
  registry_path: "./model_registry"
  max_versions: 10  # Maximum number of versions to keep
  auto_archive: true
  
  # ONNX export
  export_onnx: true
  onnx_opset: 14
